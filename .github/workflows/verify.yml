name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IR contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/Bindings.Ir
          path: Ir

      - name: Generator
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/Bindings.Generator
          path: Generator

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/Bindings.Abi
          path: Abi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Hosihikari.Bindings.Endstone.slnx -c Release -p:AbiProjectPath=${{ github.workspace }}/Abi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj

      - name: Verify generated sources
        run: python3 scripts/verify_generated.py

      - name: Validate coverage contract
        run: dotnet run --project Generator/src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- validate-coverage coverage/summary.json coverage/manifest.jsonl

  linux-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Endstone headers
        uses: actions/checkout@v4
        with:
          repository: EndstoneMC/endstone
          ref: v0.11.14
          path: endstone
          fetch-depth: 1

      - name: expected-lite
        uses: actions/checkout@v4
        with:
          repository: martinmoene/expected-lite
          ref: v0.9.0
          path: expected-lite
          fetch-depth: 1

      - name: nlohmann_json
        uses: actions/checkout@v4
        with:
          repository: nlohmann/json
          ref: v3.11.3
          path: nlohmann-json
          fetch-depth: 1

      - name: Build Linux shim
        run: |
          ./native/BindingShim/build.sh \
            --endstone-root endstone \
            --expected-lite-include expected-lite/include \
            --nlohmann-include nlohmann-json/include \
            --output artifacts/native/libHosihikari.Bindings.Endstone.Shim.so

      - name: Inspect exported entry points
        run: |
          nm -D --defined-only artifacts/native/libHosihikari.Bindings.Endstone.Shim.so \
            | grep -E 'hosihikari_(get_binding_table_v1|endstone_get_server)'
